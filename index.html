<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Global Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #login-container {
            height: auto;
            padding: 40px;
            align-items: center;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            width: 100%;
        }

        .btn-secondary {
            background: #764ba2;
        }

        .btn-logout {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-header {
            background: #667eea;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-list {
            background: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 2px solid #e0e0e0;
            overflow-x: auto;
            white-space: nowrap;
        }

        .user-list span {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 0 5px;
            font-size: 14px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            margin: 5px 0;
            word-wrap: break-word;
        }

        .message.sent {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.received {
            background: #f0f0f0;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message small {
            display: block;
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 2px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
        }

        .send-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn:hover {
            background: #5a67d8;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-btn:not(.active) {
            background: #f0f0f0;
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Login Container -->
    <div id="login-container" class="container">
        <h2>🌍 Connect</h2>
        <p>Chat with people far away in real-time!</p>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showSignUp()" id="signup-tab">Sign Up</button>
            <button class="tab-btn" onclick="showSignIn()" id="signin-tab">Sign In</button>
        </div>

        <div id="signup-fields">
            <input type="email" id="signup-email" placeholder="Email" class="input-field">
            <input type="password" id="signup-password" placeholder="Password (min 6 characters)" class="input-field">
            <button onclick="signUp()" class="btn">Create Account</button>
        </div>

        <div id="login-fields" style="display: none;">
            <input type="email" id="login-email" placeholder="Email" class="input-field">
            <input type="password" id="login-password" placeholder="Password" class="input-field">
            <button onclick="signIn()" class="btn btn-secondary">Sign In</button>
        </div>
    </div>

    <!-- Chat Container -->
    <div id="chat-container" class="container" style="display: none;">
        <div class="chat-header">
            <h2>Global Chat 🌐</h2>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
        
        <div id="user-list" class="user-list">
            <span>Loading users...</span>
        </div>
        
        <div id="messages" class="messages"></div>
        
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type your message..." class="message-input">
            <button onclick="sendMessage()" class="send-btn">Send</button>
        </div>
    </div>

    <script>
        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC0ESCW4w9k_WOi5spBsIzpxKnrDO9f6Bo",
            authDomain: "hoxiii.firebaseapp.com",
            projectId: "hoxiii",
            storageBucket: "hoxiii.firebasestorage.app",
            messagingSenderId: "692386720672",
            appId: "1:692386720672:android:dc08ab6898b6e5d26392c5"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Enable offline persistence
        db.enablePersistence()
            .catch(err => console.log('Offline mode enabled'));

        // Variables
        let currentUser = null;
        let onlineUsers = new Set();

        // Tab functions
        function showSignUp() {
            document.getElementById('signup-fields').style.display = 'block';
            document.getElementById('login-fields').style.display = 'none';
            document.getElementById('signup-tab').classList.add('active');
            document.getElementById('signin-tab').classList.remove('active');
        }

        function showSignIn() {
            document.getElementById('signup-fields').style.display = 'none';
            document.getElementById('login-fields').style.display = 'block';
            document.getElementById('signup-tab').classList.remove('active');
            document.getElementById('signin-tab').classList.add('active');
        }

        // Auth state observer
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('chat-container').style.display = 'flex';
                
                updateUserStatus(user.uid, true);
                loadMessages();
                listenOnlineUsers();
            } else {
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('chat-container').style.display = 'none';
            }
        });

        // Sign Up
        function signUp() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }
            
            auth.createUserWithEmailAndPassword(email, password)
                .then(() => {
                    document.getElementById('signup-email').value = '';
                    document.getElementById('signup-password').value = '';
                })
                .catch(error => alert(error.message));
        }

        // Sign In
        function signIn() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    document.getElementById('login-email').value = '';
                    document.getElementById('login-password').value = '';
                })
                .catch(error => alert(error.message));
        }

        // Logout
        function logout() {
            if (currentUser) {
                updateUserStatus(currentUser.uid, false);
            }
            auth.signOut();
        }

        // Update user status
        async function updateUserStatus(uid, isOnline) {
            try {
                await db.collection('users').doc(uid).set({
                    email: auth.currentUser?.email,
                    online: isOnline,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            } catch (error) {
                console.log('Status update error:', error);
            }
        }

        // Listen for online users
        function listenOnlineUsers() {
            db.collection('users')
                .where('online', '==', true)
                .onSnapshot(snapshot => {
                    onlineUsers.clear();
                    snapshot.forEach(doc => {
                        if (doc.id !== currentUser?.uid) {
                            onlineUsers.add(doc.data().email);
                        }
                    });
                    
                    const userListDiv = document.getElementById('user-list');
                    if (onlineUsers.size === 0) {
                        userListDiv.innerHTML = '<span>🔴 No one else online</span>';
                    } else {
                        userListDiv.innerHTML = '<span>🟢 Online: </span>' + 
                            Array.from(onlineUsers).map(email => 
                                `<span>${email.split('@')[0]}</span>`
                            ).join('');
                    }
                });
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (message && currentUser) {
                try {
                    await db.collection('messages').add({
                        text: message,
                        userId: currentUser.uid,
                        userEmail: currentUser.email,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    input.value = '';
                } catch (error) {
                    alert('Failed to send message. Check your connection.');
                }
            }
        }

        // Load messages
        function loadMessages() {
            const messagesDiv = document.getElementById('messages');
            
            db.collection('messages')
                .orderBy('timestamp')
                .limit(100)
                .onSnapshot(snapshot => {
                    messagesDiv.innerHTML = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const messageDiv = document.createElement('div');
                        
                        messageDiv.className = msg.userId === currentUser?.uid ? 
                            'message sent' : 'message received';
                        
                        let timeText = 'Just now';
                        if (msg.timestamp) {
                            const date = msg.timestamp.toDate();
                            timeText = date.toLocaleTimeString([], { 
                                hour: '2-digit', 
                                minute: '2-digit' 
                            });
                        }
                        
                        messageDiv.innerHTML = `
                            <strong>${msg.userEmail.split('@')[0]}:</strong> ${msg.text}
                            <small>${timeText}</small>
                        `;
                        
                        messagesDiv.appendChild(messageDiv);
                    });
                    
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                });
        }

        // Enter key to send
        document.getElementById('message-input')?.addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        // Show sign up by default
        showSignUp();
    </script>
</body>
</html>
